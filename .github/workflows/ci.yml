name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本以 package.json 的 packageManager 字段为准，此处不再重复指定
      # （同时指定会触发 ERR_PNPM_BAD_PM_VERSION：Multiple versions of pnpm specified）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint .

      - name: Type check
        run: pnpm run type-check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build-only
